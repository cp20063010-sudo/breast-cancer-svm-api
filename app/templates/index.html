<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chẩn đoán Ung thư vú - SVM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .feature-box { font-size: 0.85rem; }
    </style>
</head>
<body class="container py-4">
    <div class="text-center mb-4">
        <h2 class="text-primary">Hệ thống Phân loại Khối u (Minh họa)</h2>
        <p class="text-danger fw-bold">{{ warning }}</p>
    </div>

    <div class="row">
        <div class="col-lg-8">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0">Nhập 30 chỉ số sinh thiết</h5>
                </div>
                <div class="card-body">
                    <form id="predictForm">
                        <div class="row g-2">
                            {% for feature in feature_names %}
                            <div class="col-md-4 col-sm-6 feature-box">
                                <label class="form-label mb-1">{{ feature }}</label>
                                <input type="number" step="any" class="form-control form-control-sm" id="{{ feature }}" required>
                            </div>
                            {% endfor %}
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between">
                            <button type="button" class="btn btn-outline-secondary" onclick="fillSample()">Điền dữ liệu mẫu (Ác tính)</button>
                            <button type="submit" class="btn btn-primary px-4">Dự đoán ngay</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm sticky-top" style="top: 20px;">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">Kết quả Chẩn đoán</h5>
                </div>
                <div class="card-body text-center" id="resultBox">
                    <p class="text-muted mt-3">Hãy nhập dữ liệu và bấm Dự đoán...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const sampleData = [17.99, 10.38, 122.8, 1001.0, 0.1184, 0.2776, 0.3001, 0.1471, 0.2419, 0.07871, 1.095, 0.9053, 8.589, 153.4, 0.006399, 0.04904, 0.05373, 0.01587, 0.03003, 0.006193, 25.38, 17.33, 184.6, 2019.0, 0.1622, 0.6656, 0.7119, 0.2654, 0.4601, 0.1189];
        const featureNames = {{ feature_names | tojson }};

        function fillSample() {
            featureNames.forEach((feat, index) => {
                document.getElementById(feat).value = sampleData[index];
            });
        }

        document.getElementById('predictForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const resultBox = document.getElementById('resultBox');
            resultBox.innerHTML = '<div class="spinner-border text-primary" role="status"></div><p>Đang phân tích...</p>';

            let features = {};
            featureNames.forEach(feat => {
                features[feat] = parseFloat(document.getElementById(feat).value);
            });

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ features: features })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    let color = data.predicted_class === 0 ? 'text-danger' : 'text-success';
                    resultBox.innerHTML = `
                        <h3 class="${color} fw-bold">${data.predicted_label.toUpperCase()}</h3>
                        <hr>
                        <p class="mb-1">Xác suất Ác tính: <b>${(data.probability_malignant * 100).toFixed(2)}%</b></p>
                        <p class="mb-1">Xác suất Lành tính: <b>${(data.probability_benign * 100).toFixed(2)}%</b></p>
                        <p class="text-muted mt-3" style="font-size: 0.8rem">Phiên bản mô hình: ${data.model_version}</p>
                    `;
                } else {
                    resultBox.innerHTML = `<p class="text-danger">Lỗi dữ liệu: ${JSON.stringify(data.detail)}</p>`;
                }
            } catch (error) {
                resultBox.innerHTML = `<p class="text-danger">Lỗi kết nối tới máy chủ.</p>`;
            }
        });
    </script>
</body>
</html>
