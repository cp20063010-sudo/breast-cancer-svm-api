<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QC Nhận Diện - LIMS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            background-image: repeating-linear-gradient(45deg, #f0f0f0 25%, transparent 25%, transparent 75%, #f0f0f0 75%, #f0f0f0), repeating-linear-gradient(45deg, #f0f0f0 25%, #f8f9fa 25%, #f8f9fa 75%, #f0f0f0 75%, #f0f0f0);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #4a4a4a;
        }

        /* Thanh điều hướng (Navbar) */
        .top-nav {
            background: white;
            border-radius: 30px;
            padding: 0.5rem 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            display: inline-flex;
            gap: 15px;
            margin: 1.5rem auto;
        }
        .nav-btn {
            border: none;
            background: transparent;
            font-weight: 700;
            color: #888;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .nav-btn.active { background: #eff3fe; color: #5a73d8; }
        .nav-btn.danger { color: #ff758c; }
        .nav-btn:hover { background: #f8f9fa; }

        /* Khung giao diện (Cards) */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            border: 2px solid white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            padding: 1.5rem;
            height: 100%;
        }
        .card-title { font-weight: 800; color: #333; font-size: 1.1rem; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        
        /* Khu vực nhập liệu */
        .input-container { max-height: 400px; overflow-y: auto; padding-right: 10px; }
        .input-container::-webkit-scrollbar { width: 6px; }
        .input-container::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 10px; }
        
        .feature-box { margin-bottom: 0.8rem; }
        .feature-box label { font-size: 0.75rem; font-weight: 700; color: #aaa; text-transform: uppercase; margin-bottom: 2px; display: block;}
        .form-control {
            border: none;
            background: #f4f6f9;
            border-radius: 12px;
            padding: 0.6rem 1rem;
            font-weight: 600;
            color: #555;
        }
        .form-control:focus { box-shadow: 0 0 0 3px rgba(255,154,158,0.2); background: white; }

        /* Nút bấm gradient */
        .btn-gradient {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            border: none;
            border-radius: 20px;
            color: #6a4a50;
            font-weight: 800;
            padding: 0.8rem 2rem;
            width: 100%;
            transition: 0.3s;
        }
        .btn-gradient:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,154,158,0.4); }

        /* Hiển thị kết quả */
        .result-label { font-size: 2.5rem; font-weight: 900; line-height: 1; margin-bottom: 0; }
        .text-malignant { color: #ff758c; }
        .text-benign { color: #6ee7b7; }
        .prob-box { background: #fdfdfd; border: 1px solid #eee; border-radius: 15px; padding: 1rem; }
        .progress { height: 8px; border-radius: 10px; background-color: #f0f0f0; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- Thanh Điều Hướng -->
    <div class="text-center">
        <div class="top-nav">
            <a href="#" class="nav-btn">🏠 Home</a>
            <a href="#" class="nav-btn active">🔬 QC Nhận diện</a>
            <a href="#" class="nav-btn">📋 LIMS Kho</a>
            <a href="#" class="nav-btn">🧪 Bào chế</a>
            <a href="#" class="nav-btn">🔮 Bản đồ sao</a>
            <a href="/logout" class="nav-btn danger">🚪 Thoát</a>
        </div>
    </div>

    <div class="container pb-5">
        <div class="row g-4">
            
            <!-- Cột trái: Nhập liệu -->
            <div class="col-lg-5">
                <div class="glass-card">
                    <div class="card-title">
                        <span>⚙️ Nhập Liệu Hình Thái</span>
                        <button type="button" class="btn btn-sm btn-light rounded-pill text-muted fw-bold" onclick="fillSample()">🪄 Mẫu Test</button>
                    </div>
                    <form id="predictForm">
                        <div class="input-container row g-2">
                            {% for feature in feature_names %}
                            <div class="col-6 feature-box">
                                <label>{{ feature | replace(" ", "_") }}</label>
                                <input type="number" step="any" class="form-control form-control-sm" id="{{ feature }}" required>
                            </div>
                            {% endfor %}
                        </div>
                        <div class="mt-4">
                            <button type="submit" class="btn-gradient">Phân tích AI 🧠</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Cột phải: Kết quả & Radar -->
            <div class="col-lg-7">
                <div class="glass-card d-flex flex-column">
                    <div class="card-title">
                        <span>🏷️ Mẫu Nhận Diện</span>
                        <span id="qcStatus" class="badge bg-light text-muted border px-3 py-2 rounded-pill">Chờ dữ liệu</span>
                    </div>
                    
                    <div class="row flex-grow-1 align-items-center" id="resultContainer">
                        <div class="col-md-6 text-center">
                            <h1 style="font-size: 5rem; opacity: 0.1; margin: 0;">🦠</h1>
                            <p class="text-muted fw-bold mt-2">Đang chờ hệ thống phân tích...</p>
                            <p class="text-danger" style="font-size: 0.75rem;">{{ warning }}</p>
                        </div>
                        <div class="col-md-6">
                            <!-- Nơi vẽ biểu đồ Radar -->
                            <canvas id="radarChart" width="100" height="100" style="opacity: 0.3;"></canvas>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Dữ liệu mẫu (Khối u ác tính)
        const sampleData = [17.99, 10.38, 122.8, 1001.0, 0.1184, 0.2776, 0.3001, 0.1471, 0.2419, 0.07871, 1.095, 0.9053, 8.589, 153.4, 0.006399, 0.04904, 0.05373, 0.01587, 0.03003, 0.006193, 25.38, 17.33, 184.6, 2019.0, 0.1622, 0.6656, 0.7119, 0.2654, 0.4601, 0.1189];
        const featureNames = {{ feature_names | tojson }};
        let radarInstance = null;

        function fillSample() {
            featureNames.forEach((feat, index) => {
                document.getElementById(feat).value = sampleData[index];
            });
        }

        // Khởi tạo biểu đồ Radar trống
        function initRadar(dataArray) {
            const ctx = document.getElementById('radarChart').getContext('2d');
            if (radarInstance) radarInstance.destroy();
            
            radarInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['Radius', 'Texture', 'Perimeter', 'Area', 'Smoothness'],
                    datasets: [{
                        label: 'Chỉ số hình thái',
                        data: dataArray,
                        backgroundColor: 'rgba(255, 117, 140, 0.2)',
                        borderColor: '#ff758c',
                        pointBackgroundColor: '#ff758c',
                        borderWidth: 2
                    }]
                },
                options: {
                    scales: { r: { ticks: { display: false } } },
                    plugins: { legend: { display: false } }
                }
            });
        }
        initRadar([0,0,0,0,0]);

        document.getElementById('predictForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Cập nhật Radar dựa trên 5 chỉ số đầu tiên (Mean)
            let currentData = [
                document.getElementById(featureNames[0]).value,
                document.getElementById(featureNames[1]).value,
                document.getElementById(featureNames[2]).value / 10, // Scale bớt cho đẹp biểu đồ
                document.getElementById(featureNames[3]).value / 100, // Scale bớt cho đẹp biểu đồ
                document.getElementById(featureNames[4]).value * 100
            ];
            initRadar(currentData);
            document.getElementById('radarChart').style.opacity = '1';

            let features = {};
            featureNames.forEach(feat => { features[feat] = parseFloat(document.getElementById(feat).value); });

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ features: features })
                });
                const data = await response.json();
                
                if (response.ok) {
                    let isMalignant = data.predicted_class === 0;
                    let colorClass = isMalignant ? 'text-malignant' : 'text-benign';
                    let label = isMalignant ? 'ÁC TÍNH' : 'LÀNH TÍNH';
                    let bgProgress = isMalignant ? 'bg-danger' : 'bg-success';
                    
                    document.getElementById('qcStatus').innerHTML = isMalignant ? '<span class="text-danger fw-bold">CẢNH BÁO</span>' : '<span class="text-success fw-bold">QC PASSED</span>';
                    
                    document.getElementById('resultContainer').innerHTML = `
                        <div class="col-md-6 px-4">
                            <p class="text-muted fw-bold mb-1" style="font-size: 0.8rem; letter-spacing: 1px;">KẾT QUẢ CHẨN ĐOÁN</p>
                            <h2 class="result-label ${colorClass}">${label}</h2>
                            <p class="text-muted mt-2" style="font-size: 0.85rem;">Mô hình phát hiện đặc điểm cấu trúc bất thường thông qua phép biến đổi SVM.</p>
                            
                            <div class="prob-box mt-4">
                                <div class="d-flex justify-content-between" style="font-size: 0.8rem; font-weight: 700;">
                                    <span>Độ tin cậy:</span>
                                    <span class="${colorClass}">${(Math.max(data.probability_malignant, data.probability_benign) * 100).toFixed(1)}%</span>
                                </div>
                                <div class="progress">
                                    <div class="progress-bar ${bgProgress}" style="width: ${Math.max(data.probability_malignant, data.probability_benign) * 100}%"></div>
                                </div>
                            </div>
                            <p class="text-muted mt-3 mb-0" style="font-size: 0.7rem; text-align: center;">Phiên bản: ${data.model_version}</p>
                        </div>
                        <div class="col-md-6">
                            <canvas id="radarChart" width="100" height="100"></canvas>
                        </div>
                    `;
                    initRadar(currentData);
                }
            } catch (error) {
                alert("Lỗi kết nối máy chủ");
            }
        });
    </script>
</body>
</html>
