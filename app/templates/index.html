<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chẩn đoán Ung thư vú - SVM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Thiết lập bảng màu Xanh Bơ */
        :root {
            --avocado-primary: #8cb369;  /* Xanh bơ chủ đạo */
            --avocado-hover: #739953;    /* Xanh bơ đậm (khi di chuột) */
            --avocado-bg: #f5f9f1;       /* Nền web xanh bơ rất nhạt */
            --avocado-border: #c9dbc1;   /* Viền ô nhập liệu */
            --text-dark: #3a4f29;        /* Chữ màu lục sẫm */
        }
        
        body { 
            background-color: var(--avocado-bg); 
            color: var(--text-dark);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        
        .text-avocado { color: var(--avocado-hover) !important; }
        .bg-avocado { background-color: var(--avocado-primary) !important; color: white; }
        
        /* Thẻ Card bo góc mềm mại */
        .card { 
            border: none; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(140, 179, 105, 0.15); 
            overflow: hidden;
        }
        .card-header { 
            border-bottom: none; 
            padding: 1.2rem 1.5rem;
        }
        
        /* Nút bấm */
        .btn-primary { 
            background-color: var(--avocado-primary); 
            border-color: var(--avocado-primary); 
            border-radius: 10px;
            font-weight: 600;
        }
        .btn-primary:hover { 
            background-color: var(--avocado-hover); 
            border-color: var(--avocado-hover); 
        }
        .btn-outline-secondary {
            color: var(--avocado-hover);
            border-color: var(--avocado-primary);
            border-radius: 10px;
            background-color: white;
        }
        .btn-outline-secondary:hover {
            background-color: var(--avocado-primary);
            color: white;
        }

        /* Ô nhập liệu */
        .feature-box label { 
            font-size: 0.85rem; 
            font-weight: 600; 
            color: #55703f; 
        }
        .form-control {
            border: 1.5px solid var(--avocado-border);
            border-radius: 8px;
            background-color: #ffffff;
            font-size: 0.9rem;
        }
        .form-control:focus {
            border-color: var(--avocado-primary);
            box-shadow: 0 0 0 0.25rem rgba(140, 179, 105, 0.25);
        }
        
        /* Hiệu ứng mượt mà */
        .btn, .form-control, .card {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="container py-5">
    <div class="text-center mb-5">
        <h2 class="fw-bold text-avocado">🥑 Hệ thống Phân loại Khối u</h2>
        <p class="text-danger fw-bold" style="opacity: 0.85;">{{ warning }}</p>
    </div>

    <div class="row g-4">
        <!-- Cột nhập liệu -->
        <div class="col-lg-8">
            <div class="card h-100">
                <div class="card-header bg-avocado">
                    <h5 class="mb-0">🔬 Nhập 30 chỉ số sinh thiết</h5>
                </div>
                <div class="card-body p-4">
                    <form id="predictForm">
                        <div class="row g-3">
                            {% for feature in feature_names %}
                            <div class="col-md-4 col-sm-6 feature-box">
                                <label class="form-label mb-1">{{ feature }}</label>
                                <input type="number" step="any" class="form-control form-control-sm" id="{{ feature }}" required>
                            </div>
                            {% endfor %}
                        </div>
                        <hr class="my-4" style="border-color: var(--avocado-border);">
                        <div class="d-flex justify-content-between align-items-center">
                            <button type="button" class="btn btn-outline-secondary" onclick="fillSample()">Tự động điền (Mẫu Ác tính)</button>
                            <button type="submit" class="btn btn-primary px-5 py-2">Dự đoán ngay ✨</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Cột hiển thị kết quả -->
        <div class="col-lg-4">
            <div class="card sticky-top" style="top: 30px;">
                <div class="card-header bg-avocado">
                    <h5 class="mb-0">📊 Kết quả Phân tích</h5>
                </div>
                <div class="card-body text-center p-4" id="resultBox">
                    <div class="py-5">
                        <h1 style="font-size: 3.5rem; opacity: 0.2;">🩺</h1>
                        <p class="text-muted mt-3">Hãy nhập dữ liệu và bấm Dự đoán để xem hệ thống AI phân tích...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Dữ liệu mẫu
        const sampleData = [17.99, 10.38, 122.8, 1001.0, 0.1184, 0.2776, 0.3001, 0.1471, 0.2419, 0.07871, 1.095, 0.9053, 8.589, 153.4, 0.006399, 0.04904, 0.05373, 0.01587, 0.03003, 0.006193, 25.38, 17.33, 184.6, 2019.0, 0.1622, 0.6656, 0.7119, 0.2654, 0.4601, 0.1189];
        const featureNames = {{ feature_names | tojson }};

        function fillSample() {
            featureNames.forEach((feat, index) => {
                document.getElementById(feat).value = sampleData[index];
            });
        }

        document.getElementById('predictForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const resultBox = document.getElementById('resultBox');
            
            // Hiệu ứng loading màu xanh bơ
            resultBox.innerHTML = '<div class="py-5"><div class="spinner-border text-avocado" style="width: 3rem; height: 3rem;" role="status"></div><p class="mt-3 fw-bold text-avocado">Đang xử lý thuật toán...</p></div>';

            let features = {};
            featureNames.forEach(feat => {
                features[feat] = parseFloat(document.getElementById(feat).value);
            });

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ features: features })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    let isMalignant = data.predicted_class === 0;
                    let colorClass = isMalignant ? 'text-danger' : 'text-success';
                    let icon = isMalignant ? '⚠️' : '✅';
                    
                    // Vẽ giao diện kết quả kèm thanh tiến trình
                    resultBox.innerHTML = `
                        <div class="py-2">
                            <h1 style="font-size: 3.5rem;">${icon}</h1>
                            <h3 class="${colorClass} fw-bold mt-2">${data.predicted_label.toUpperCase()}</h3>
                            
                            <div class="mt-4 text-start bg-white p-3 rounded-3 border" style="border-color: var(--avocado-border) !important;">
                                <div class="d-flex justify-content-between mb-1">
                                    <span style="font-size: 0.9rem;">Khả năng Ác tính:</span>
                                    <span class="fw-bold text-danger">${(data.probability_malignant * 100).toFixed(2)}%</span>
                                </div>
                                <div class="progress mb-3" style="height: 10px;">
                                    <div class="progress-bar bg-danger" role="progressbar" style="width: ${data.probability_malignant * 100}%"></div>
                                </div>
                                
                                <div class="d-flex justify-content-between mb-1">
                                    <span style="font-size: 0.9rem;">Khả năng Lành tính:</span>
                                    <span class="fw-bold text-success">${(data.probability_benign * 100).toFixed(2)}%</span>
                                </div>
                                <div class="progress" style="height: 10px;">
                                    <div class="progress-bar bg-success" role="progressbar" style="width: ${data.probability_benign * 100}%"></div>
                                </div>
                            </div>
                            <p class="text-muted mt-4 mb-0" style="font-size: 0.8rem">Phiên bản: ${data.model_version}</p>
                        </div>
                    `;
                } else {
                    resultBox.innerHTML = `<div class="py-4"><h1 style="font-size: 3rem;">❌</h1><p class="text-danger fw-bold mt-3">Lỗi dữ liệu</p><p class="text-muted" style="font-size: 0.85rem;">${JSON.stringify(data.detail)}</p></div>`;
                }
            } catch (error) {
                resultBox.innerHTML = `<div class="py-4"><h1 style="font-size: 3rem;">🔌</h1><p class="text-danger fw-bold mt-3">Lỗi kết nối tới máy chủ.</p></div>`;
            }
        });
    </script>
</body>
</html>
